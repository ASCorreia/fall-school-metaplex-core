[toolchain]
anchor_version = "1.2.0"
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
soulbound_nft = "CPEZfd24CjWS7pDkQrdhyTQAparykfRb9K2WWJiBG33b"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 20000

# `anchor test` uses Surfpool by default (a mainnet fork), so the MPL Core
# program is already available. If you prefer the legacy validator
# (`anchor test --validator legacy`), the config below clones MPL Core
# from mainnet into the local validator.
[test.validator]
url = "https://api.mainnet-beta.solana.com"
# Non-default gossip port: the OS default (8000) is held by an unrelated
# local process on this machine.
gossip_port = 8010

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
